<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" role="img" aria-label="딕싯">
  <!-- 몽환적인 밤 + 토끼 실루엣. 딕싯의 '이야기/상상' 톤. -->
  <defs>
    <linearGradient id="dixit-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4a92" />
      <stop offset="1" stop-color="#2f6f80" />
    </linearGradient>
    <!-- 초승달은 호 두 개로 그리면 반지름 보정에 걸려 사라진다. 원에서 원을 파낸다. -->
    <mask id="dixit-moon">
      <circle cx="66" cy="22" r="11" fill="#fff" />
      <circle cx="60" cy="17" r="10" fill="#000" />
    </mask>
  </defs>
  <rect width="88" height="88" fill="url(#dixit-sky)" />

  <circle cx="66" cy="22" r="11" fill="#f7e9c0" mask="url(#dixit-moon)" />

  <g fill="#f7e9c0">
    <circle cx="18" cy="18" r="1.6" opacity=".8" />
    <circle cx="32" cy="27" r="1.1" opacity=".6" />
    <circle cx="12" cy="36" r="1.3" opacity=".55" />
    <circle cx="76" cy="52" r="1.4" opacity=".6" />
    <circle cx="46" cy="14" r="1" opacity=".5" />
  </g>

  <g fill="#f7e9c0">
    <ellipse cx="46" cy="46" rx="2.6" ry="8" transform="rotate(-12 46 46)" />
    <ellipse cx="53" cy="47" rx="2.6" ry="8" transform="rotate(10 53 47)" />
    <circle cx="49" cy="58" r="8" />
    <ellipse cx="35" cy="68" rx="14" ry="10" />
    <circle cx="21" cy="64" r="4.5" />
  </g>
</svg>
