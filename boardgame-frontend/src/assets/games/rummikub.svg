<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" role="img" aria-label="루미큐브">
  <!-- 숫자 타일 3장을 부채꼴로. 색 숫자가 루미큐브의 가장 큰 특징이다. -->
  <rect width="88" height="88" fill="#efe6d5" />

  <!-- 가운데 타일이 양옆 숫자를 가리지 않도록 폭(27)보다 넓게 벌려 둔다. -->
  <g transform="rotate(-14 21.5 52)">
    <rect x="8" y="34" width="27" height="36" rx="5" fill="#fdfaf3" stroke="#d6c8ae" />
    <text x="21.5" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#c0392b">7</text>
  </g>

  <g transform="rotate(14 66.5 52)">
    <rect x="53" y="34" width="27" height="36" rx="5" fill="#fdfaf3" stroke="#d6c8ae" />
    <text x="66.5" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1f1f1f">9</text>
  </g>

  <rect x="30.5" y="28" width="27" height="36" rx="5" fill="#fdfaf3" stroke="#d6c8ae" />
  <text x="44" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2b5aa8">8</text>
</svg>
