# boardgame-frontend 프로젝트 내부 /nginx.conf

server {
    listen 8333; # 프론트엔드 컨테이너 포트 (기존 포트에 맞게 설정)
    server_name localhost;

    location / {
        root   /app/dist; # Vue 빌드 결과물(dist)이 위치한 경로
        index  index.html index.htm;
        
        # 💡 핵심: 요청한 경로에 실제 파일이 없으면 index.html로 우회
        try_files $uri $uri/ /index.html;
    }
}