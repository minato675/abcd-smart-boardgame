spring.application.name=boardgame

server.port=8111
# nginx 가 /inte 접두사를 붙여 프록시한다(X-Forwarded-Prefix). 이걸 꺼두면 springdoc 이
# 접두사 없는 절대경로(/v3/api-docs/swagger-config 등)를 만들어서, 브라우저가 그 경로를
# nginx 의 / 블록(프런트 SPA)으로 잘못 요청하게 되고 스펙 로딩이 실패해 Swagger UI 가
# 기본 Petstore 데모로 폴백한다.
server.forward-headers-strategy=framework

mqtt.host=${MQTT_HOST:i15a402.p.ssafy.io}
mqtt.port=${MQTT_PORT:8113}
mqtt.username=ssafy
mqtt.password=ssafy
mqtt.client-id=spring-mqtt-client
mqtt.default-topic=default/topic
mqtt.qos=1

# QnA 시작 명령 후 준비 완료(qna/ready) 를 기다리는 시간.
# 넘기면 wake word 를 강제로 되살린다 - QnA 서버가 못 뜬 채 마이크만 꺼져 있으면 안 된다.
# 서버가 이미 떠 있는 상태에서 명령만 받는 것이라 짧게 잡는다.
qna.ready-timeout-sec=5

# QnA 준비 완료(qna/ready) 후 응답(qna/res) 을 기다리는 시간.
# 넘기면 wake word 를 강제로 되살린다 - 안 그러면 그 방은 마이크가 꺼진 채 갇힌다.
# STT + 답변 생성 + TTS 를 모두 포함한 시간이라 넉넉해야 한다.
qna.response-timeout-sec=60

# 예약한 게임이 반납됐다는 팝업(/room/{roomNumber}/reservation/ready) 의 응답 대기 시간.
# 태블릿에도 같은 값을 페이로드로 내려보내 양쪽 타이머를 맞춘다.
# 넘기면 무응답을 '안 빌린다' 로 보고 그 예약을 취소한 뒤 다음 대기자에게 넘긴다 -
# 안 그러면 1등이 팝업을 무시했을 때 2등은 그 게임이 다음에 또 반납될 때까지 알림을 못 받는다.
reservation.popup-timeout-sec=60

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:i15a402.p.ssafy.io}:${DB_PORT:8432}/boardgame?options=-c%20timezone=Asia/Seoul
spring.datasource.username=ssafy
spring.datasource.password=ssafy
spring.datasource.driver-class-name=org.postgresql.Driver

logging.pattern.level=%5p [%X{requestId:-}]
logging.level.com.ssafy.boardgame.config.RequestLoggingFilter=INFO

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# 태그/메서드를 알파벳·HTTP 메서드 순으로 정렬해 목록 순서가 빌드마다 흔들리지 않게 한다
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.default-produces-media-type=application/json

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.ssafy.boardgame.dto