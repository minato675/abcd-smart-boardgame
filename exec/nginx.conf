events {}

http {

    upstream inte_server {
        server inte-server:8111;
    }

    upstream boardgame_frontend {
        server boardgame-frontend:8333;
    }

    server {
        listen 80;
        server_name i15a402.p.ssafy.io;

        # Spring API
        location /inte/ {
            proxy_pass http://inte_server/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /inte;
        }

        location / {
            proxy_pass http://boardgame_frontend/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
